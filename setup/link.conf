# ============================================================================
# setup/link.conf — THE ONLY FILE YOU EDIT to change link settings.
#
# After editing:
#   sudo ./install.sh --role air --only 50-config
#   sudo systemctl restart wifibroadcast@drone
# (and the same on the gs side with --role gs / wifibroadcast@gs)
#
# ⚠ Values in the RADIO section MUST be identical on both ends. A mismatch
#   in channel, bandwidth, mcs, stbc, ldpc, short_gi or link_domain gives you
#   a dead or one-way link with NO readable error in the logs.
#
# This file is sourced by install.sh, then link.conf.local (if present, for
# host-specific overrides — see link.conf.local.example), then CLI flags
# override both. See VERSIONS for driver/wfb-ng version pins (a separate,
# maintainer-level file).
# ============================================================================

# --- RADIO (identical on both ends) -----------------------------------------
WIFI_CHANNEL=165        # 165 = 5825 MHz. Module is 5 GHz ONLY. See docs/tuning.md
                        # for the legal picture (ch165 is not EU-harmonised RLAN).
BANDWIDTH=20            # 20 for bring-up; 10 once the link is proven (+3 dB
                        # budget, ~1.4x range, half the throughput). 5 and 40
                        # are both forbidden: 5 crashes wfb_tx, 40 has a known
                        # firmware injection bug on this chipset.
WIFI_REGION=BO          # Lifts channel/DFS/power restrictions in the DRIVER
                        # only. Does NOT create legal authorization — see
                        # docs/tuning.md before transmitting at real power.
MCS_INDEX=1             # QPSK 1/2 (HT). Range/rate sweet spot: 13 Mbit/s
                        # @20MHz, 6.5 Mbit/s @10MHz. See docs/tuning.md.
STBC=1                  # 2T2R space-time block coding, 1 spatial stream over
                        # both chains. Requires BOTH antennas fitted. (Do not
                        # set 2 or 3 -- those need 4 TX chains this card
                        # doesn't have; wfb_tx won't error, it'll just misbehave.)
LDPC=0                  # wfb-ng's own master.cfg documents LDPC as
                        # "currently available only for 8812au" (default is 1
                        # upstream). Force 0 for this 8812eu-based hardware.
SHORT_GI=False          # Long guard interval (800ns) = tolerance to multipath
                        # over ground reflections. Costs ~11% rate vs short GI.
LINK_DOMAIN=imav        # Link identity (SHA1-hashed into a MAC-embedded
                        # link_id, filtered by kernel BPF on RX). Only matters
                        # once there's more than one wfb-ng link nearby -- if
                        # you add a second drone later, give IT a different
                        # LINK_DOMAIN (and a separate link.conf), not this one.

# --- POWER SOURCE AND TX POWER ----------------------------------------------
# ⚠ NEVER transmit without BOTH antennas fitted. This module has no
#   "antenna lost protection" (driver author's own words) -- transmitting
#   without an antenna WILL destroy the power amplifier.
#
# ⚠ POWERING THE MODULE FROM A RASPBERRY PI USB PORT IS OUTSIDE THE
#   DOCUMENTED BUDGET. Hard numbers: Pi 4 gives 1.2A total across ALL USB
#   ports combined. Pi 5 gives 1.6A only with a genuine 5A PSU, otherwise
#   600mA, and that budget is shared with the fan header. The module's own
#   datasheet asks for "5V/>3A" and OpenIPC field reports put real draw at
#   5V/2.xA at useful power, requiring a heatsink+fan.
#   Lowering WIFI_TXPOWER reduces draw, but there is NO published curve
#   mapping the wfb-ng mBm scale to actual current -- nobody can honestly
#   promise "at 500 you're within budget". Treat POWER_SOURCE=usb-pi as a
#   bench-only convenience, not a safety guarantee.
#   Symptoms of exceeding the budget are easy to misdiagnose as software
#   bugs: Pi resets under load, the link drops when you'd expect it to be
#   solid, USB errors in `dmesg`. If you see those, suspect power first.
#   The carrier board has a proper path for this: J1/J3 (battery/BEC leads)
#   + S1 switched to V_batt. Even on a desk, prefer a powered USB hub or a
#   separate 5V rail over the Pi's own USB port.
#
# POWER_SOURCE declares where the module's power actually comes from, and
# CAPS the WIFI_TXPOWER the installer will accept without an explicit
# override flag. This is the one line you flip going from a desk to the field.
#   usb-pi    = module is bus-powered from the Raspberry Pi's own USB port.
#               Capped at TXPOWER_MAX_USB. For driver bring-up, config
#               iteration, and proving the link works on a bench. NOT for
#               range testing, NOT for flight.
#   hub       = a powered USB hub or a separate 5V rail feeding the module,
#               while data still goes over USB. Same ceiling as external.
#   external  = power from the carrier board's battery/BEC leads (J1/J3),
#               S1 switched to V_batt, heatsink fitted. Unlocks full range.
POWER_SOURCE=usb-pi

# dBm*100 for the 8812eu chipset (8812au uses NEGATIVE values -- don't mix up
# scales; also don't confuse this with OpenIPC's unrelated 0-63
# driver_txpower_override scale used in /etc/wfb.conf on some other stacks --
# that number space does NOT apply here).
# Rough ladder: ~+5dB per +500. PA begins saturating around 2000 -- above
# that you're buying heat and spectral splatter, not range. This value is
# not a calibrated dBm figure; the driver author describes it as "some
# internal, dimensionless value, only positively related to real TX power".
#
#   300   very quiet desk test, transmitters a meter apart
#   500   starting point on USB-Pi power                    <- DEFAULT
#   800   practical ceiling while POWER_SOURCE=usb-pi
#  1000   requires external power
#  1500   field use with a heatsink; watch temperature in wfb-cli
#  2000   practical maximum (PA saturation threshold)
#  3150   driver's hard maximum -- DO NOT USE, pure loss above ~2000
WIFI_TXPOWER=500

# Limits enforced by the installer -- leave these alone unless you know why
# you're changing them:
TXPOWER_MAX_USB=800        # above this while POWER_SOURCE=usb-pi -> refused
TXPOWER_MAX_EXTERNAL=2000  # above this -> requires --i-know-what-im-doing

# --- FEC ---------------------------------------------------------------------
FEC_MAVLINK_K=1;  FEC_MAVLINK_N=2;  FEC_MAVLINK_TIMEOUT=30
FEC_TUNNEL_K=1;   FEC_TUNNEL_N=2;   FEC_TUNNEL_TIMEOUT=20
FEC_VIDEO_K=8;    FEC_VIDEO_N=12    # 50% overhead. No FEC_VIDEO_TIMEOUT: unlike
                                    # mavlink/tunnel (sparse streams that need a
                                    # timeout to close a lingering block), video
                                    # fills a 12-packet block in milliseconds at
                                    # any real bitrate -- there's nothing to wait for.

# --- MAVLINK -----------------------------------------------------------------
MAVLINK_SERIAL=/dev/serial0   # Pi UART. wfb-ng's native `serial:` transport
                              # accepts this directly (no mavlink-routerd /
                              # socat needed). Case-insensitive, but paths
                              # containing '.' or ':' (e.g. /dev/serial/by-id/…)
                              # are rejected with "Unsupported peer address".
MAVLINK_BAUD=115200
MAVLINK_UDP_PORT=             # Leave empty (default) to read MAVLink from
                              # MAVLINK_SERIAL. Set to a port number to have
                              # the air unit LISTEN on that UDP port instead
                              # of opening a serial device -- for a companion
                              # computer or SITL feeding MAVLink over UDP.
                              # Same as --mavlink-udp PORT on the command line.
QGC_HOST=127.0.0.1           # 127.0.0.1 = QGroundControl runs on the gs host
                              # itself. A LAN address = QGC on a separate laptop.
QGC_PORT=14550
MAVLINK_SYS_ID=3             # sysid used for injected RADIO_STATUS (drives the
                              # RSSI panel in QGC). Only matters if you later
                              # merge a second link into one QGC instance.

# --- IP TUNNEL (carries SSH) --------------------------------------------------
TUNNEL_IP_AIR=10.5.0.2       # ssh pi@10.5.0.2 from the ground station
TUNNEL_IP_GS=10.5.0.1        # ssh user@10.5.0.1 from the drone
TUNNEL_PREFIX=24

# --- VIDEO (phase 2) ----------------------------------------------------------
# The radio side needs nothing here: wfb-ng's own [drone]/[gs] profiles
# declare the video stream unconditionally, so udp://127.0.0.1:5602 (air) and
# :5600 (gs) are already live the moment wifibroadcast@drone/@gs is running.
# This section only controls whether/how a camera feeds that socket.
#
# The source is pluggable: VIDEO_SOURCE picks a file from
# setup/config/video-sources/<name>.sh, each implementing the same three
# functions (packages/validate/pipeline) -- see docs/integration.md for the
# module contract. Only 'rtsp' ships today. 'uvc' (USB/HDMI capture) and
# 'csi' (Pi camera) are documented but NOT implemented -- adding one is a
# single new file in config/video-sources/, no changes anywhere else.
VIDEO_ENABLE=0
VIDEO_SOURCE=rtsp             # rtsp | uvc | csi (only rtsp ships -- see above)

# --- rtsp source: an IP camera on Ethernet, already emitting RTSP ------------
VIDEO_CAM_URL=                 # e.g. rtsp://192.168.10.50:554/stream1
                               # ⚠ Getting the camera and the Pi's eth0 onto a
                               # shared subnet (static IPs -- there's no DHCP
                               # server on a point-to-point link) is your job,
                               # not the installer's. See docs/integration.md
                               # for the one-line nmcli command. Don't use a
                               # 10.5.0.x address for that subnet: it collides
                               # with the wfb-ng tunnel below.
VIDEO_CODEC=h265               # h264 | h265 -- whatever the camera actually
                               # sends. ⚠ MUST match on both ends: the air
                               # side picks depay/parse/pay elements by this
                               # name, the gs side picks which rtsp@<codec>
                               # instance to enable.
VIDEO_RTSP_LATENCY=0           # rtspsrc jitterbuffer, ms. 0 = minimum latency;
                               # raise only if you see corrupted/glitchy frames.
VIDEO_RTSP_PROTOCOLS=tcp       # RTSP transport for the camera<->Pi hop -- a
                               # short wired link, so TCP costs nothing here
                               # and sidesteps UDP port/firewall fuss on the
                               # camera side. Unrelated to the radio link
                               # itself, which is always UDP regardless.

# --- future sources (uvc/csi): capture parameters, unused by rtsp -----------
# rtsp repackages whatever bitstream the camera already sends (no
# re-encoding), so none of these apply to it -- they exist for a future
# uvc.sh/csi.sh that has to actually configure a capture device and encoder.
VIDEO_DEV=/dev/video0
VIDEO_WIDTH=1280; VIDEO_HEIGHT=720; VIDEO_FPS=30

# --- shared by every source: what the camera is actually sending ------------
# Used for the airtime budget check at install time (see BANDWIDTH/MCS_INDEX
# in the RADIO section above), regardless of source -- even rtsp needs this
# to know the camera's real bitrate, since it isn't re-encoding it.
VIDEO_BITRATE_KBPS=2000

# --- ground station: re-serve as RTSP for any number of viewers -------------
# Uses wfb-ng's own rtsp@<codec>.service, from the wfb-ng package -- we don't
# reimplement it. Set to 0 to skip it; video is still readable directly off
# udp://127.0.0.1:5600 (most players, and QGC, can read RTP straight off a
# UDP port) either way.
VIDEO_RTSP_SERVER=1
