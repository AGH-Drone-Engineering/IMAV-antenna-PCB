# ============================================================================
# setup/link.conf — the file you edit to change link settings.
#
# Two parts:
#   SETTINGS    what you choose. Start here.
#   INTERNALS   values this hardware needs; correct as shipped.
#
# HOST-SPECIFIC OVERRIDES
#   Values that differ between the two machines belong in
#   setup/link.conf.local, not here. Copy setup/link.conf.local.example to
#   create it -- it is gitignored and overrides this file.
#   Load order: link.conf -> link.conf.local -> install.sh flags.
#
# AFTER EDITING EITHER FILE
#   sudo ./install.sh --role air|gs --only 50-config
#   sudo systemctl restart wifibroadcast@drone   # or wifibroadcast@gs
#
# Reasoning behind every value: docs/tuning.md
# ============================================================================


# ############################################################################
#  SETTINGS
# ############################################################################

# --- Radio ------------------------------------------------------------------
# These four must be identical on both machines. install.sh prints a
# fingerprint of them after --only 50-config; compare it between the hosts.
WIFI_CHANNEL=165        # 5 GHz channel, or a frequency in MHz. Module is 5 GHz only.
BANDWIDTH=20            # 10 or 20.
MCS_INDEX=1             # 0-7. Higher is faster and shorter-range.
LINK_DOMAIN=imav        # Link identity. A second, independent link needs a different value.

# --- Power ------------------------------------------------------------------
# Constraint: both antennas fitted before transmitting. No antenna-lost
# protection on this module -- transmitting without one destroys the amplifier.
POWER_SOURCE=external   # usb-pi | hub | external.    per-host: link.conf.local
WIFI_TXPOWER=1500       # dBm x100, 0-3150.           per-host: link.conf.local

# --- MAVLink ----------------------------------------------------------------
MAVLINK_SERIAL=/dev/serial0   # Flight controller's UART, on the air unit.
QGC_HOST=127.0.0.1            # MAVLink destination on the gs end.  per-host: link.conf.local

# --- Camera -----------------------------------------------------------------
VIDEO_ENABLE=0                # 0 or 1. Both machines.
VIDEO_CAM_URL=                # Camera's RTSP URL, e.g. rtsp://192.168.10.50:554/stream1. Air unit only.
VIDEO_CODEC=h265              # h264 or h265, matching the camera. Both machines.
VIDEO_BITRATE_KBPS=2000       # Camera's bitrate, kbit/s. Checked against available airtime at install time.

# --- SSH --------------------------------------------------------------------
# Nothing to configure. The tunnel carries SSH whenever the link is up:
#   ssh <user>@10.5.0.2   reaches the air unit
#   ssh <user>@10.5.0.1   reaches the ground station


# ############################################################################
#  INTERNALS -- correct for this hardware. Change only with a specific reason.
# ############################################################################

# --- Radio ------------------------------------------------------------------
# Part of the same both-machines fingerprint as the radio settings above.
WIFI_REGION=BO          # Driver regulatory domain.
STBC=1                  # 0 or 1 on this 2T2R card.
LDPC=0                  # 0 or 1.
SHORT_GI=False          # True or False. False tolerates multipath.

# --- Power ceilings ---------------------------------------------------------
TXPOWER_MAX_USB=800       # WIFI_TXPOWER ceiling while POWER_SOURCE=usb-pi.
TXPOWER_MAX_EXTERNAL=2000 # Ceiling while POWER_SOURCE=hub|external. Above it: --i-know-what-im-doing.

# --- MAVLink ----------------------------------------------------------------
MAVLINK_BAUD=115200           # Must match the flight controller's telemetry port.
MAVLINK_UDP_PORT=             # When set, the air unit listens here instead of opening MAVLINK_SERIAL.
QGC_PORT=14550                # UDP port QGC listens on.
MAVLINK_SYS_ID=3              # Sysid for injected RADIO_STATUS messages.

# --- IP tunnel (carries SSH) ------------------------------------------------
TUNNEL_IP_AIR=10.5.0.2        # Air-side address of the point-to-point tunnel.
TUNNEL_IP_GS=10.5.0.1         # Gs-side address. Both in TUNNEL_PREFIX's subnet.
TUNNEL_PREFIX=24

# --- Camera -----------------------------------------------------------------
VIDEO_SOURCE=rtsp             # Selects setup/config/video-sources/<name>.sh. Present: rtsp.
VIDEO_RTSP_LATENCY=0          # rtspsrc jitter buffer, ms.
VIDEO_RTSP_PROTOCOLS=tcp      # RTSP transport between the camera and the air unit.
VIDEO_RTSP_SERVER=1           # 0 or 1. Serves rtsp://<gs-host>:8554/wfb on the gs role.

# Capture device and dimensions. Read by source modules that capture from a
# device; unused by rtsp.
VIDEO_DEV=/dev/video0
VIDEO_WIDTH=1280; VIDEO_HEIGHT=720; VIDEO_FPS=30

# --- FEC --------------------------------------------------------------------
# fec_k/fec_n: data/total packets per block, TX side. fec_timeout: ms, 0 disables.
FEC_MAVLINK_K=1;  FEC_MAVLINK_N=2;  FEC_MAVLINK_TIMEOUT=30
FEC_TUNNEL_K=1;   FEC_TUNNEL_N=2;   FEC_TUNNEL_TIMEOUT=20
FEC_VIDEO_K=8;    FEC_VIDEO_N=12    # No FEC_VIDEO_TIMEOUT setting for this stream.
