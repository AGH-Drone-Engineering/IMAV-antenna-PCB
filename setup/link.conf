# ============================================================================
# setup/link.conf — the file you edit to change link settings.
#
# Load order: link.conf -> link.conf.local (host-specific overrides, copy
# from link.conf.local.example, not tracked in git) -> CLI flags.
#
# After editing:
#   sudo ./install.sh --role air|gs --only 50-config
#   sudo systemctl restart wifibroadcast@drone   # or wifibroadcast@gs
#
# Settings marked "both ends" must be identical on the air and gs hosts.
# install.sh prints a fingerprint of these values after --only 50-config;
# compare it between hosts. See docs/tuning.md for the reasoning behind
# every value in this file.
# ============================================================================

# --- RADIO (all settings: both ends) -----------------------------------------
WIFI_CHANNEL=165        # 5 GHz channel, or a frequency in MHz. Module is 5 GHz only.
BANDWIDTH=20            # 10 or 20.
WIFI_REGION=BO          # Driver regulatory domain.
MCS_INDEX=1             # 0-7.
STBC=1                  # 0 or 1 on this 2T2R card.
LDPC=0                  # 0 or 1.
SHORT_GI=False          # True or False.
LINK_DOMAIN=imav        # Link identity string. A second, independent link needs a different value.

# --- POWER --------------------------------------------------------------------
# Constraint: both antennas must be fitted before transmitting. No antenna-lost
# protection on this module -- transmitting without one destroys the amplifier.
POWER_SOURCE=usb-pi     # usb-pi | hub | external. Caps WIFI_TXPOWER via
                        # TXPOWER_MAX_USB/TXPOWER_MAX_EXTERNAL below.
WIFI_TXPOWER=500        # dBm x100, positive, 0-3150. Enforced ceiling depends on POWER_SOURCE.
TXPOWER_MAX_USB=800       # Ceiling while POWER_SOURCE=usb-pi.
TXPOWER_MAX_EXTERNAL=2000 # Ceiling while POWER_SOURCE=hub|external. Above it: --i-know-what-im-doing.

# --- MAVLINK --------------------------------------------------------------------
MAVLINK_SERIAL=/dev/serial0   # Device path. Rejects paths containing '.' or ':'.
MAVLINK_BAUD=115200           # Must match the flight controller's telemetry port.
MAVLINK_UDP_PORT=             # UDP port. When set, the air unit listens here instead of MAVLINK_SERIAL.
QGC_HOST=127.0.0.1            # Where MAVLink is delivered on the gs end. 127.0.0.1 = QGC on this host.
QGC_PORT=14550                # UDP port for QGC.
MAVLINK_SYS_ID=3               # Sysid for injected RADIO_STATUS messages.

# --- IP TUNNEL (carries SSH) --------------------------------------------------
TUNNEL_IP_AIR=10.5.0.2        # Air-side address of the point-to-point tunnel.
TUNNEL_IP_GS=10.5.0.1         # Gs-side address. Both in TUNNEL_PREFIX's subnet.
TUNNEL_PREFIX=24

# --- VIDEO ---------------------------------------------------------------------
VIDEO_ENABLE=0                # 0 or 1.
VIDEO_SOURCE=rtsp              # Selects setup/config/video-sources/<name>.sh. Present: rtsp.

# rtsp source
VIDEO_CAM_URL=                 # RTSP URL, e.g. rtsp://192.168.10.50:554/stream1. Required when VIDEO_SOURCE=rtsp.
VIDEO_CODEC=h265                # h264 or h265, both ends.
VIDEO_RTSP_LATENCY=0             # rtspsrc jitter buffer, ms.
VIDEO_RTSP_PROTOCOLS=tcp          # RTSP transport for the camera link.

# Capture device and dimensions. Read by source modules that capture from a
# device; unused by rtsp.
VIDEO_DEV=/dev/video0
VIDEO_WIDTH=1280; VIDEO_HEIGHT=720; VIDEO_FPS=30

VIDEO_BITRATE_KBPS=2000        # Camera bitrate, kbit/s. Used for the airtime budget check at install time.
VIDEO_RTSP_SERVER=1            # 0 or 1. Enables rtsp@<codec> on the gs role.

# --- FEC ---------------------------------------------------------------------
# fec_k/fec_n: data/total packets per block, TX side. fec_timeout: ms, 0 disables.
FEC_MAVLINK_K=1;  FEC_MAVLINK_N=2;  FEC_MAVLINK_TIMEOUT=30
FEC_TUNNEL_K=1;   FEC_TUNNEL_N=2;   FEC_TUNNEL_TIMEOUT=20
FEC_VIDEO_K=8;    FEC_VIDEO_N=12    # No FEC_VIDEO_TIMEOUT setting for this stream.
