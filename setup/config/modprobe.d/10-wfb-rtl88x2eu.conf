# Installed by setup/lib/30-driver.sh from this repo copy.
#
# The rtl88x2eu driver ships this exact file in its own repo
# (realtek_88x2eu.conf) but neither dkms.conf nor `make install` actually
# installs it -- verified against the driver's Makefile and dkms.conf. So we
# place it ourselves; without it, `iw reg set <region>` (which wfb-ng's own
# server.py runs at every start) may not reach the driver, and TX power
# tables/limits behave differently than documented.
#
#   rtw_regd_src=1          take the regulatory domain from cfg80211/the OS,
#                           so wfb-ng's `iw reg set <wifi_region>` is honoured
#   rtw_tx_pwr_by_rate=0    disable the per-rate power table
#   rtw_tx_pwr_lmt_enable=0 disable the regulatory power limit table
#
# Together these make `iw dev <nic> set txpower fixed <mBm>` (how wfb-ng's
# wifi_txpower setting reaches the card) actually take effect.
options 8812eu rtw_regd_src=1 rtw_tx_pwr_by_rate=0 rtw_tx_pwr_lmt_enable=0
