# Installed by setup/lib/30-driver.sh (optional, but cheap and closes a real
# race). wfb-ng's own server.py already runs `nmcli device set <wlan>
# managed no` every time it starts (init_wlans() in wfb_ng/server.py), but
# only AFTER the interface has appeared -- there's a window between hotplug
# and wfb-ng's own startup where NetworkManager could grab the card, rename
# it, or kick off a scan. This static rule closes that window.
#
# Match by DRIVER, not by interface name -- wlan0/wlan1/wlx* naming is not
# stable across reboots or card swaps. The match string is the driver's
# reported name (`rtl88x2eu`, i.e. what `ethtool -i <iface>` shows and what
# ID_NET_DRIVER carries in udev), NOT the .ko filename (`8812eu`) -- getting
# this backwards silently no-ops.
[keyfile]
unmanaged-devices=driver:rtl88x2eu
